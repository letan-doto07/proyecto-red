<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Paint</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>🎨 Mini Paint</h1>

        <!-- HERRAMIENTAS -->

        <div class="barra">

            <label>Color:</label>

            <input
                type="color"
                id="color"
                value="#000000"
            >

            <label>Grosor:</label>

            <input
                type="range"
                id="tamano"
                min="1"
                max="40"
                value="5"
            >

            <button id="lapiz">
                 Lápiz
            </button>

            <button id="goma">
                 Goma
            </button>

            <button id="cubeta">
                 Cubeta
            </button>

            <button id="limpiar">
                 Limpiar
            </button>

        </div>


        <!-- CANVAS -->

        <canvas
            id="canvas"
            width="1000"
            height="600">
        </canvas>


        <!-- GUARDAR -->

        <div class="guardar">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre del dibujo"
            >

            <button id="guardar">
                 Guardar dibujo
            </button>

        </div>


        <!-- GALERÍA -->

        <h2>🖼️ Galería</h2>

        <div
            id="galeria"
            class="galeria">
        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
